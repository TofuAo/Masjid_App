version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: masjid_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-masjid_password}
      MYSQL_DATABASE: ${DB_NAME:-masjid_app}
      MYSQL_USER: ${DB_USER:-masjid_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-masjid_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/masjid_app_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    networks:
      - masjid_network

  # Backend API
  backend:
    build: ./backend
    container_name: masjid_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-masjid_user}
      - DB_PASSWORD=${DB_PASSWORD:-masjid_password}
      - DB_NAME=${DB_NAME:-masjid_app}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - JWT_EXPIRES_IN=24h
      - PORT=5000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - EMAIL_USER=${EMAIL_USER:-khalidkingez@gmail.com}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Masjid App}
      - ALLOW_DEV_OTP=${ALLOW_DEV_OTP:-true}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    networks:
      - masjid_network
    volumes:
      - ./uploads:/app/uploads

  # Frontend
  frontend:
    build: .
    container_name: masjid_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - masjid_network

  # vLLM API Service
  vllm-api:
    build: ./vllm-api
    container_name: masjid_vllm_api
    restart: unless-stopped
    environment:
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      - VLLM_TENSOR_PARALLEL_SIZE=${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - masjid_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Nota: Para usar GPU, necesitas tener nvidia-docker instalado
    # Si no tienes GPU, comenta la sección 'deploy' arriba

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: masjid_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
      - vllm-api
    networks:
      - masjid_network
    environment:
      - DOMAIN=${DOMAIN:-localhost}

volumes:
  mysql_data:

networks:
  masjid_network:
    driver: bridge
