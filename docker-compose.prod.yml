version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: masjid_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-masjid_app}
      MYSQL_USER: ${DB_USER:-masjid_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/masjid_app_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - masjid_network
    # Don't expose port externally in production
    # ports:
    #   - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password

  # Backend API
  backend:
    build: ./backend
    container_name: masjid_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-masjid_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-masjid_app}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=24h
      - PORT=5000
      - FRONTEND_URL=${FRONTEND_URL}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Masjid App}
      - ALLOW_DEV_OTP=${ALLOW_DEV_OTP:-false}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - masjid_network
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build: .
    container_name: masjid_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - masjid_network
    # Don't expose port externally - nginx handles it
    # ports:
    #   - "3000:80"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: masjid_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - masjid_network
    environment:
      - DOMAIN=${DOMAIN}

volumes:
  mysql_data:
    driver: local

networks:
  masjid_network:
    driver: bridge

